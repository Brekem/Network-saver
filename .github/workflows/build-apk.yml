name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Firma release opcional con secretos del repositorio
      # (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      # Sin ellos el APK se firma con la clave debug.
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi

      - name: Tests y APK release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/UniversalRouterMode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalRouterMode-apk
          path: dist/UniversalRouterMode.apk

      # Publica (o actualiza) el Release vX.Y.Z según versionName en cada push.
      - name: Leer versión
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publicar Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Universal Router Mode ${{ steps.version.outputs.name }}
          files: dist/UniversalRouterMode.apk
          make_latest: true
          body: |
            Descarga **UniversalRouterMode.apk** (abajo, en *Assets*) e instálalo en el teléfono.
            Android pedirá permitir la instalación de apps de origen desconocido.

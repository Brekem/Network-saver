name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Firma release opcional con secretos del repositorio
      # (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      # Sin ellos el APK se firma con la clave debug.
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi

      - name: Tests y APK release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/UniversalRouterMode.apk

      # Paquete para Windows: sing-box + configuración + .bat de doble clic.
      # Antes de empaquetar, sing-box valida la configuración.
      - name: Paquete para PC
        env:
          SB: "1.11.4"
        run: |
          set -e
          base=https://github.com/SagerNet/sing-box/releases/download/v$SB
          curl -fsSL -o sb-linux.tar.gz "$base/sing-box-$SB-linux-amd64.tar.gz"
          tar xzf sb-linux.tar.gz
          ./sing-box-$SB-linux-amd64/sing-box check -c pc/config.json
          curl -fsSL -o sb-win.zip "$base/sing-box-$SB-windows-amd64.zip"
          unzip -q sb-win.zip
          mkdir -p dist/UniversalRouter-PC
          cp pc/* dist/UniversalRouter-PC/
          cp sing-box-$SB-windows-amd64/sing-box.exe dist/UniversalRouter-PC/
          cp sing-box-$SB-windows-amd64/LICENSE dist/UniversalRouter-PC/LICENSE-sing-box.txt 2>/dev/null || true
          (cd dist && zip -qr UniversalRouter-PC.zip UniversalRouter-PC)

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalRouterMode-apk
          path: |
            dist/UniversalRouterMode.apk
            dist/UniversalRouter-PC.zip

      # Publica (o actualiza) el Release vX.Y.Z según versionName en cada push.
      - name: Leer versión
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publicar Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Universal Router Mode ${{ steps.version.outputs.name }}
          files: |
            dist/UniversalRouterMode.apk
            dist/UniversalRouter-PC.zip
          make_latest: true
          body: |
            **Teléfono:** descarga **UniversalRouterMode.apk** (abajo, en *Assets*) e instálalo.
            Android pedirá permitir la instalación de apps de origen desconocido.

            **ShizukuAutoStart.exe** (Windows): ejecútalo una vez. Se instala, arranca con Windows y, cada vez que
            conectes el teléfono por USB, arranca Shizuku solo. Descarga ADB e instala Shizuku y esta app si faltan.

            **PC (tether invertido):** descarga **UniversalRouter-PC.zip**, descomprímelo y sigue `LEEME.txt`.

  # App de Windows que arranca Shizuku automáticamente al conectar el teléfono.
  # Se sube al mismo Release que el APK.
  windows-tool:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar ShizukuAutoStart.exe
        shell: cmd
        run: windows\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: ShizukuAutoStart-exe
          path: dist/ShizukuAutoStart.exe

      - name: Leer versión
        id: version
        shell: bash
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Añadir al Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          files: dist/ShizukuAutoStart.exe
